expected_stdout = "2 1 7\n2 2\n3\n1\n2\n4 4\n3\n4 4 4 4\n4 4\n1 3 \n5\n"

[[test]]
name = "struct_field_mixed_ptr_decl"
targets = ["native", "wasm", "macho", "elf"]
# A struct field declarator with a different pointer level than the first one
# (`int *a, b;`) used to get the first one's type; tinyc rejects it (#371).
expected_compile_error = "unsupported pointer level in a struct field declarator"

